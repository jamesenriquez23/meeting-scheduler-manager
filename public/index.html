<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meeting Schedule Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- REUSABLE PASSWORD INPUT COMPONENT WITH EYE TOGGLE ---
    function PasswordInput({ value, onChange, placeholder = "Enter password", required = false }) {
      const [showPassword, setShowPassword] = useState(false);

      return (
        <div class="relative">
          <input 
            type={showPassword ? "text" : "password"} 
            required={required} 
            value={value} 
            onChange={onChange}
            class="w-full border rounded px-3 py-2 pr-10 focus:outline-none focus:ring-2 focus:ring-blue-500" 
            placeholder={placeholder}
          />
          <button 
            type="button" 
            onClick={() => setShowPassword(!showPassword)}
            class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 focus:outline-none"
            title={showPassword ? "Hide password" : "Show password"}
          >
            {showPassword ? (
              // Eye Off Icon
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24M1 1l22 22" />
              </svg>
            ) : (
              // Eye Icon
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            )}
          </button>
        </div>
      );
    }

    function App() {
      const [user, setUser] = useState(null);
      const [isAuthChecking, setIsAuthChecking] = useState(true);
      
      // Auth views: 'login' | 'signup' | 'forgot' | 'reset'
      const [authMode, setAuthMode] = useState('login');
      const [authCreds, setAuthCreds] = useState({ username: '', email: '', password: '', confirmPassword: '' });
      const [resetState, setResetState] = useState({ email: '', token: '', newPassword: '', confirmNewPassword: '' });
      const [simulatedTokenNotice, setSimulatedTokenNotice] = useState('');
      const [authError, setAuthError] = useState('');
      const [authMessage, setAuthMessage] = useState('');

      const [activeTab, setActiveTab] = useState('roster');
      const [brothers, setBrothers] = useState([]);
      const [awayList, setAwayList] = useState([]);
      const [eventsList, setEventsList] = useState([]);
      const [schedule, setSchedule] = useState([]);
      
      // Profile Tab Form States
      const [profileEmail, setProfileEmail] = useState('');
      const [passData, setPassData] = useState({ currentPassword: '', newPassword: '', confirmNewPassword: '' });
      const [profileMsg, setProfileMsg] = useState('');
      const [profileErr, setProfileErr] = useState('');

      // Admin Panel States
      const [adminUsers, setAdminUsers] = useState([]);
      const [adminError, setAdminError] = useState('');

      const [newBrother, setNewBrother] = useState({ name: '', can_wt_reader: false, can_chairman: false, can_attendants: false, can_microvers: false, can_av: false });
      const [newAway, setNewAway] = useState({ brother_id: '', away_date: '' });
      const [newEvent, setNewEvent] = useState({ event_date: '', event_type: '', description: '' });

      const [genMonth, setGenMonth] = useState(9);
      const [genYear, setGenYear] = useState(2026);
      const [editingRow, setEditingRow] = useState(null);
      const [editingBrother, setEditingBrother] = useState(null);
      const [editedBrotherData, setEditedBrotherData] = useState({});
      const [errorMessage, setErrorMessage] = useState('');
      const [successModal, setSuccessModal] = useState('');
      const [isGenerating, setIsGenerating] = useState(false);

      const authFetch = (url, options = {}) => {
        const token = localStorage.getItem('token');
        const headers = {
          'Content-Type': 'application/json',
          ...(token ? { 'Authorization': `Bearer ${token}` } : {}),
          ...options.headers,
        };
        return fetch(url, { ...options, headers }).then(r => {
          if (r.status === 401) {
            localStorage.removeItem('token');
            setUser(null);
          }
          return r;
        });
      };

      useEffect(() => {
        const token = localStorage.getItem('token');
        if (token) {
          authFetch('/api/me')
            .then(r => r.json())
            .then(data => {
              if (data.user) {
                setUser(data.user);
                setProfileEmail(data.user.email || '');
                loadInitialData();
              }
            })
            .finally(() => setIsAuthChecking(false));
        } else {
          setIsAuthChecking(false);
        }
      }, []);

      const loadInitialData = () => {
        fetchBrothers();
        fetchAway();
        fetchEvents();
        fetchSchedule(genMonth, genYear);
      };

      const fetchAdminUsers = () => {
        setAdminError('');
        authFetch('/api/admin/users')
          .then(async r => {
            const res = await r.json();
            if (!r.ok) throw new Error(res.error || 'Failed to fetch users');
            setAdminUsers(res.users);
          })
          .catch(err => setAdminError(err.message));
      };

      const handleAuthSubmit = (e) => {
        e.preventDefault();
        setAuthError('');
        setAuthMessage('');

        if (authMode === 'signup' && authCreds.password !== authCreds.confirmPassword) {
          setAuthError('Passwords do not match!');
          return;
        }

        const endpoint = authMode === 'signup' ? '/api/register' : '/api/login';
        
        fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: authCreds.username,
            email: authCreds.email,
            password: authCreds.password
          })
        })
        .then(async r => {
          const res = await r.json();
          if (!r.ok) throw new Error(res.error || 'Authentication failed.');
          localStorage.setItem('token', res.token);
          setUser(res.user);
          setProfileEmail(res.user.email || '');
          loadInitialData();
        })
        .catch(err => setAuthError(err.message));
      };

      const handleRequestResetToken = (e) => {
        e.preventDefault();
        setAuthError('');
        setAuthMessage('');
        setSimulatedTokenNotice('');

        fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: resetState.email })
        })
        .then(async r => {
          const res = await r.json();
          if (!r.ok) throw new Error(res.error || 'Request failed.');
          setAuthMessage('Reset code generated!');
          if (res.simulatedResetToken) {
            setSimulatedTokenNotice(`Simulated Email Code: ${res.simulatedResetToken}`);
            setResetState(prev => ({ ...prev, token: res.simulatedResetToken }));
          }
          setAuthMode('reset');
        })
        .catch(err => setAuthError(err.message));
      };

      const handleResetPassword = (e) => {
        e.preventDefault();
        setAuthError('');
        setAuthMessage('');

        if (resetState.newPassword !== resetState.confirmNewPassword) {
          setAuthError('New passwords do not match.');
          return;
        }

        fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: resetState.email,
            token: resetState.token,
            newPassword: resetState.newPassword
          })
        })
        .then(async r => {
          const res = await r.json();
          if (!r.ok) throw new Error(res.error || 'Reset failed.');
          setAuthMessage('Password reset successfully! Please log in.');
          setAuthMode('login');
          setResetState({ email: '', token: '', newPassword: '', confirmNewPassword: '' });
          setSimulatedTokenNotice('');
        })
        .catch(err => setAuthError(err.message));
      };

      const handleUpdateProfileEmail = (e) => {
        e.preventDefault();
        setProfileErr('');
        setProfileMsg('');

        authFetch('/api/user/profile', {
          method: 'PUT',
          body: JSON.stringify({ email: profileEmail })
        })
        .then(async r => {
          const res = await r.json();
          if (!r.ok) throw new Error(res.error);
          setUser(prev => ({ ...prev, email: res.email }));
          setProfileMsg('Profile email updated successfully!');
        })
        .catch(err => setProfileErr(err.message));
      };

      const handleChangePassword = (e) => {
        e.preventDefault();
        setProfileErr('');
        setProfileMsg('');

        if (passData.newPassword !== passData.confirmNewPassword) {
          setProfileErr('New passwords do not match.');
          return;
        }

        authFetch('/api/user/change-password', {
          method: 'PUT',
          body: JSON.stringify({
            currentPassword: passData.currentPassword,
            newPassword: passData.newPassword
          })
        })
        .then(async r => {
          const res = await r.json();
          if (!r.ok) throw new Error(res.error);
          setProfileMsg('Password changed successfully!');
          setPassData({ currentPassword: '', newPassword: '', confirmNewPassword: '' });
        })
        .catch(err => setProfileErr(err.message));
      };

      const handleLogout = () => {
        authFetch('/api/logout', { method: 'POST' }).finally(() => {
          localStorage.removeItem('token');
          setUser(null);
          setAuthCreds({ username: '', email: '', password: '', confirmPassword: '' });
          setAuthMode('login');
        });
      };

      const fetchBrothers = () => authFetch('/api/brothers').then(r => r.json()).then(data => {
        const sorted = [...data].sort((a, b) => a.name.localeCompare(b.name));
        setBrothers(sorted);
      });
      const fetchAway = () => authFetch('/api/away').then(r => r.json()).then(setAwayList);
      const fetchEvents = () => {
        authFetch('/api/events')
          .then(r => r.json())
          .then(data => {
            console.log('Fetched events:', data);
            setEventsList(data);
          })
          .catch(err => console.error('Error fetching events:', err));
      };
      
      const fetchSchedule = (m = genMonth, y = genYear) => {
        authFetch(`/api/schedule?year=${y}&month=${m}`)
          .then(r => r.json())
          .then(setSchedule);
      };

      const handlePrevMonth = () => {
        let m = Number(genMonth) - 1;
        let y = Number(genYear);
        if (m < 1) { m = 12; y -= 1; }
        setGenMonth(m);
        setGenYear(y);
        fetchSchedule(m, y);
      };

      const handleNextMonth = () => {
        let m = Number(genMonth) + 1;
        let y = Number(genYear);
        if (m > 12) { m = 1; y += 1; }
        setGenMonth(m);
        setGenYear(y);
        fetchSchedule(m, y);
      };

      const resetAllSchedules = () => {
        if (window.confirm("Are you sure you want to reset and delete ALL your generated schedules? This cannot be undone.")) {
          authFetch('/api/schedule/reset/all', { method: 'DELETE' })
            .then(r => r.json())
            .then(() => {
              fetchSchedule(genMonth, genYear);
              setSuccessModal('All generated schedules have been reset successfully!');
            })
            .catch(err => setErrorMessage('Failed to reset schedules.'));
        }
      };

      const addBrother = (e) => {
        e.preventDefault();
        setErrorMessage('');
        authFetch('/api/brothers', {
          method: 'POST',
          body: JSON.stringify(newBrother)
        })
        .then(async r => {
          const res = await r.json();
          if (!r.ok) throw new Error(res.error);
          fetchBrothers();
          setNewBrother({ name: '', can_wt_reader: false, can_chairman: false, can_attendants: false, can_microvers: false, can_av: false });
          setSuccessModal('Brother added successfully!');
        })
        .catch(err => setErrorMessage(err.message));
      };

      const addAway = (e) => {
        e.preventDefault();
        if (!newAway.brother_id || !newAway.away_date) return;
        authFetch('/api/away', {
          method: 'POST',
          body: JSON.stringify(newAway)
        }).then(() => { 
          fetchAway(); 
          setNewAway({ brother_id: '', away_date: '' }); 
          setSuccessModal('Away date added successfully!');
        });
      };

      const addEvent = (e) => {
        e.preventDefault();
        if (!newEvent.event_date || !newEvent.event_type) {
          alert('Please select both event date and type');
          return;
        }
        
        // Format date to DD.MM.YYYY for consistency
        const dateParts = newEvent.event_date.split('-');
        const formattedDate = `${dateParts[2]}.${dateParts[1]}.${dateParts[0]}`;
        
        const eventPayload = {
          event_date: formattedDate,
          event_type: newEvent.event_type,
          description: newEvent.description
        };
        
        console.log('Submitting event:', eventPayload);
        
        authFetch('/api/events', {
          method: 'POST',
          body: JSON.stringify(eventPayload)
        })
        .then(async (r) => {
          const data = await r.json();
          console.log('Event API response:', data, 'Status:', r.status);
          if (!r.ok) throw new Error(data.error || 'Failed to add event');
          return data;
        })
        .then(() => { 
          fetchEvents(); 
          setNewEvent({ event_date: '', event_type: '', description: '' }); 
          setSuccessModal('Special event added successfully!');
        })
        .catch(err => {
          console.error('Error adding event:', err);
          alert(`Error: ${err.message}`);
        });
      };

      const togglePrivilege = (brother, field) => {
        const updated = { ...brother, [field]: !brother[field] };
        authFetch(`/api/brothers/${brother.id}`, {
          method: 'PUT',
          body: JSON.stringify(updated)
        }).then(fetchBrothers);
      };

      const startEditBrother = (brother) => {
        setEditingBrother(brother.id);
        setEditedBrotherData({
          name: brother.name,
          can_wt_reader: brother.can_wt_reader,
          can_chairman: brother.can_chairman,
          can_attendants: brother.can_attendants,
          can_microvers: brother.can_microvers,
          can_av: brother.can_av
        });
      };

      const saveBrotherEdit = (brotherId) => {
        setErrorMessage('');
        authFetch(`/api/brothers/${brotherId}`, {
          method: 'PUT',
          body: JSON.stringify(editedBrotherData)
        })
        .then(async r => {
          const res = await r.json();
          if (!r.ok) throw new Error(res.error);
          fetchBrothers();
          setEditingBrother(null);
          setEditedBrotherData({});
          setSuccessModal('Brother updated successfully!');
        })
        .catch(err => setErrorMessage(err.message));
      };

      const cancelEditBrother = () => {
        setEditingBrother(null);
        setEditedBrotherData({});
      };

      const generateSchedule = () => {
        setErrorMessage('');
        setIsGenerating(true);

        authFetch('/api/schedule/generate', {
          method: 'POST',
          body: JSON.stringify({ year: Number(genYear), month: Number(genMonth) })
        })
        .then(async (response) => {
          const contentType = response.headers.get('content-type');
          if (!response.ok) {
            if (contentType && contentType.includes('application/json')) {
              const errData = await response.json();
              throw new Error(errData.error || 'Generation failed.');
            } else {
              throw new Error(`Server returned status ${response.status}.`);
            }
          }
          return response.json();
        })
        .then((data) => {
          setSchedule(data.schedule);
          setSuccessModal('Monthly schedule generated successfully!');
        })
        .catch((err) => setErrorMessage(err.message))
        .finally(() => setIsGenerating(false));
      };

      const saveScheduleEdit = (id) => {
        authFetch(`/api/schedule/${id}`, {
          method: 'PUT',
          body: JSON.stringify(editingRow)
        }).then(() => {
          setEditingRow(null);
          fetchSchedule(genMonth, genYear);
          setSuccessModal('Schedule entry updated successfully!');
        });
      };

      const deleteScheduleRow = (id) => {
        authFetch(`/api/schedule/${id}`, { method: 'DELETE' }).then(() => fetchSchedule(genMonth, genYear));
      };

      const groupScheduleByMonth = (items) => {
        const groups = {};
        items.forEach(item => {
          const parts = item.schedule_date.split('.');
          if (parts.length === 3) {
            const monthYear = `${parts[1]}.${parts[2]}`;
            if (!groups[monthYear]) groups[monthYear] = [];
            groups[monthYear].push(item);
          }
        });
        return groups;
      };

      if (isAuthChecking) {
        return (
          <div class="min-h-screen flex items-center justify-center bg-gray-100">
            <div class="animate-spin rounded-full h-10 w-10 border-4 border-blue-600 border-t-transparent"></div>
          </div>
        );
      }

      // --- AUTHENTICATION SCREENS ---
      if (!user) {
        return (
          <div class="min-h-screen flex items-center justify-center bg-gray-100 px-4">
            <div class="max-w-md w-full bg-white rounded-lg shadow-md p-8">
              <h2 class="text-2xl font-bold text-center text-blue-900 mb-2">Meeting Schedule Manager</h2>
              <p class="text-sm text-center text-gray-500 mb-6">
                {authMode === 'signup' && 'Create an account to manage your schedule'}
                {authMode === 'login' && 'Sign in to access your scheduler'}
                {authMode === 'forgot' && 'Reset your password via Email'}
                {authMode === 'reset' && 'Enter reset code and new password'}
              </p>
              
              {authError && (
                <div class="bg-red-100 text-red-700 p-3 rounded mb-4 text-sm font-semibold">
                  {authError}
                </div>
              )}

              {authMessage && (
                <div class="bg-green-100 text-green-700 p-3 rounded mb-4 text-sm font-semibold">
                  {authMessage}
                </div>
              )}

              {simulatedTokenNotice && (
                <div class="bg-yellow-100 border border-yellow-300 text-yellow-800 p-3 rounded mb-4 text-xs font-mono">
                  {simulatedTokenNotice}
                </div>
              )}

              {/* LOGIN / SIGNUP FORMS */}
              {(authMode === 'login' || authMode === 'signup') && (
                <form onSubmit={handleAuthSubmit} class="space-y-4">
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Username or Email</label>
                    <input 
                      type="text" 
                      required 
                      value={authCreds.username} 
                      onChange={e => setAuthCreds({...authCreds, username: e.target.value})}
                      class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" 
                      placeholder="Enter username or email"
                    />
                  </div>

                  {authMode === 'signup' && (
                    <div>
                      <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                      <input 
                        type="email" 
                        required 
                        value={authCreds.email} 
                        onChange={e => setAuthCreds({...authCreds, email: e.target.value})}
                        class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" 
                        placeholder="you@example.com"
                      />
                    </div>
                  )}

                  <div>
                    <div class="flex justify-between items-center mb-1">
                      <label class="block text-sm font-medium text-gray-700">Password</label>
                      {authMode === 'login' && (
                        <button 
                          type="button" 
                          onClick={() => { setAuthMode('forgot'); setAuthError(''); setAuthMessage(''); }} 
                          class="text-xs text-blue-600 hover:underline"
                        >
                          Forgot password?
                        </button>
                      )}
                    </div>
                    <PasswordInput 
                      required 
                      value={authCreds.password} 
                      onChange={e => setAuthCreds({...authCreds, password: e.target.value})}
                      placeholder="Enter password"
                    />
                  </div>

                  {authMode === 'signup' && (
                    <div>
                      <label class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
                      <PasswordInput 
                        required 
                        value={authCreds.confirmPassword} 
                        onChange={e => setAuthCreds({...authCreds, confirmPassword: e.target.value})}
                        placeholder="Confirm password"
                      />
                    </div>
                  )}

                  <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded font-semibold hover:bg-blue-700 transition">
                    {authMode === 'signup' ? 'Create Account' : 'Sign In'}
                  </button>
                </form>
              )}

              {/* FORGOT PASSWORD FORM */}
              {authMode === 'forgot' && (
                <form onSubmit={handleRequestResetToken} class="space-y-4">
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Registered Email Address</label>
                    <input 
                      type="email" 
                      required 
                      value={resetState.email} 
                      onChange={e => setResetState({...resetState, email: e.target.value})}
                      class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" 
                      placeholder="Enter your account email"
                    />
                  </div>

                  <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded font-semibold hover:bg-blue-700 transition">
                    Send Reset Link
                  </button>
                </form>
              )}

              {/* RESET PASSWORD FORM */}
              {authMode === 'reset' && (
                <form onSubmit={handleResetPassword} class="space-y-4">
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Reset Code / Token</label>
                    <input 
                      type="text" 
                      required 
                      value={resetState.token} 
                      onChange={e => setResetState({...resetState, token: e.target.value})}
                      class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" 
                      placeholder="Enter reset code"
                    />
                  </div>

                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">New Password</label>
                    <PasswordInput 
                      required 
                      value={resetState.newPassword} 
                      onChange={e => setResetState({...resetState, newPassword: e.target.value})}
                      placeholder="Enter new password"
                    />
                  </div>

                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Confirm New Password</label>
                    <PasswordInput 
                      required 
                      value={resetState.confirmNewPassword} 
                      onChange={e => setResetState({...resetState, confirmNewPassword: e.target.value})}
                      placeholder="Confirm new password"
                    />
                  </div>

                  <button type="submit" class="w-full bg-green-600 text-white py-2 rounded font-semibold hover:bg-green-700 transition">
                    Update Password
                  </button>
                </form>
              )}

              <div class="mt-6 text-center border-t pt-4 space-y-2">
                {authMode === 'signup' && (
                  <button onClick={() => { setAuthMode('login'); setAuthError(''); setAuthMessage(''); }} class="text-sm text-blue-600 hover:underline font-medium">
                    Already have an account? Sign In
                  </button>
                )}
                {authMode === 'login' && (
                  <button onClick={() => { setAuthMode('signup'); setAuthError(''); setAuthMessage(''); }} class="text-sm text-blue-600 hover:underline font-medium">
                    Need an account? Create one here
                  </button>
                )}
                {(authMode === 'forgot' || authMode === 'reset') && (
                  <button onClick={() => { setAuthMode('login'); setAuthError(''); setAuthMessage(''); }} class="text-sm text-blue-600 hover:underline font-medium">
                    ← Back to Sign In
                  </button>
                )}
              </div>
            </div>
          </div>
        );
      }

      const groupedSchedule = groupScheduleByMonth(schedule);
      const targetKey = `${String(genMonth).padStart(2, '0')}.${genYear}`;

      return (
        <div class="w-full min-h-screen bg-gray-50 flex flex-col">
          {/* LOADING OVERLAY */}
          {isGenerating && (
            <div class="fixed inset-0 bg-black/50 flex items-center justify-center z-50">
              <div class="bg-white rounded-lg p-4 sm:p-6 max-w-sm w-full mx-4 shadow-xl text-center">

                                {editingRow && editingRow.id === s.id ? (
                                  <>
                                    <td class="p-1 sm:p-2"><input type="text" value={editingRow.wt_reader} onChange={e => setEditingRow({...editingRow, wt_reader: e.target.value})} class="border w-full p-1 rounded text-xs" /></td>
                                    <td class="p-1 sm:p-2"><input type="text" value={editingRow.chairman} onChange={e => setEditingRow({...editingRow, chairman: e.target.value})} class="border w-full p-1 rounded text-xs" /></td>
                                    <td class="p-1 sm:p-2"><input type="text" value={editingRow.attendants} onChange={e => setEditingRow({...editingRow, attendants: e.target.value})} class="border w-full p-1 rounded text-xs" /></td>
                                    <td class="p-1 sm:p-2"><input type="text" value={editingRow.microvers} onChange={e => setEditingRow({...editingRow, microvers: e.target.value})} class="border w-full p-1 rounded text-xs" /></td>
                                    <td class="p-1 sm:p-2"><input type="text" value={editingRow.av} onChange={e => setEditingRow({...editingRow, av: e.target.value})} class="border w-full p-1 rounded text-xs" /></td>
                                    <td class="p-1 sm:p-2 text-center text-xs">
                                      <button onClick={() => saveScheduleEdit(s.id)} class="text-green-600 font-bold mr-1">Save</button>
                                      <button onClick={() => setEditingRow(null)} class="text-gray-600">Cancel</button>
                                    </td>
                                  </>
                                ) : (
                                  <>
                                    <td class="p-2 sm:p-3">{s.wt_reader}</td>
                                    <td class="p-2 sm:p-3">{s.chairman}</td>
                                    <td class="p-2 sm:p-3">{s.attendants}</td>
                                    <td class="p-2 sm:p-3">{s.microvers}</td>
                                    <td class="p-2 sm:p-3">{s.av}</td>
                                    <td class="p-2 sm:p-3 text-center text-xs">
                                      <button onClick={() => setEditingRow(s)} class="text-blue-600 hover:underline mr-1 sm:mr-2">Edit</button>
                                      <button onClick={() => deleteScheduleRow(s.id)} class="text-red-600 hover:underline">Delete</button>
                                    </td>
                                  </>
                                )}
                              </tr>
                            ))}
                          </tbody>
                        </table>
                        </div>
                      </div>
                    );
                  })}
                </div>
              ) : (
                <div class="bg-white p-4 sm:p-6 rounded text-center text-gray-500 shadow text-sm">
                  No schedule entries found for this month or the previous 2 months.
                </div>
              )}
            </div>
          )}

          {/* TAB 4: USER PROFILE & SETTINGS */}
          {activeTab === 'profile' && (
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6">
              {profileMsg && (
                <div class="col-span-1 md:col-span-2 bg-green-100 text-green-700 p-3 sm:p-4 rounded font-semibold text-sm">
                  {profileMsg}
                </div>
              )}
              {profileErr && (
                <div class="col-span-1 md:col-span-2 bg-red-100 text-red-700 p-3 sm:p-4 rounded font-semibold text-sm">
                  {profileErr}
                </div>
              )}

              {/* PROFILE INFO & EMAIL UPDATE */}
              <div class="bg-white p-3 sm:p-6 rounded shadow">
                <h2 class="text-base sm:text-lg font-bold mb-4 border-b pb-2">Profile Information</h2>
                <div class="mb-4">
                  <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Username</label>
                  <p class="text-gray-800 font-bold text-base sm:text-lg">{user.username}</p>
                </div>

                <form onSubmit={handleUpdateProfileEmail} class="space-y-3 sm:space-y-4">
                  <div>
                    <label class="block text-xs sm:text-sm font-medium text-gray-700 mb-1">Email Address</label>
                    <input 
                      type="email" 
                      required 
                      value={profileEmail} 
                      onChange={e => setProfileEmail(e.target.value)}
                      class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" 
                      placeholder="Enter your email address"
                    />
                  </div>
                  <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded font-semibold hover:bg-blue-700 transition text-sm w-full sm:w-auto">
                    Update Email
                  </button>
                </form>
              </div>

              {/* CHANGE PASSWORD */}
              <div class="bg-white p-3 sm:p-6 rounded shadow">
                <h2 class="text-base sm:text-lg font-bold mb-4 border-b pb-2">Update Password</h2>
                <form onSubmit={handleChangePassword} class="space-y-3 sm:space-y-4">
                  <div>
                    <label class="block text-xs sm:text-sm font-medium text-gray-700 mb-1">Current Password</label>
                    <PasswordInput 
                      required 
                      value={passData.currentPassword} 
                      onChange={e => setPassData({...passData, currentPassword: e.target.value})}
                      placeholder="Enter current password"
                    />
                  </div>

                  <div>
                    <label class="block text-xs sm:text-sm font-medium text-gray-700 mb-1">New Password</label>
                    <PasswordInput 
                      required 
                      value={passData.newPassword} 
                      onChange={e => setPassData({...passData, newPassword: e.target.value})}
                      placeholder="Enter new password"
                    />
                  </div>

                  <div>
                    <label class="block text-xs sm:text-sm font-medium text-gray-700 mb-1">Confirm New Password</label>
                    <PasswordInput 
                      required 
                      value={passData.confirmNewPassword} 
                      onChange={e => setPassData({...passData, confirmNewPassword: e.target.value})}
                      placeholder="Confirm new password"
                    />
                  </div>

                  <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded font-semibold hover:bg-green-700 transition text-sm w-full sm:w-auto">
                    Change Password
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* TAB 5: ADMIN PANEL */}
          {activeTab === 'admin' && user.username.toLowerCase() === 'admin' && (
            <div class="bg-white p-3 sm:p-6 rounded shadow">
              <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-6 pb-3 border-b">
                <div>
                  <h2 class="text-lg sm:text-xl font-bold text-purple-900">Admin Control Panel</h2>
                  <p class="text-xs text-gray-500 mt-1">Manage registered user accounts</p>
                </div>
                <button onClick={fetchAdminUsers} class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-1.5 rounded text-xs sm:text-sm transition w-full sm:w-auto">
                  Refresh List
                </button>
              </div>

              {adminError && (
                <div class="bg-red-100 text-red-700 p-3 sm:p-4 rounded mb-4 text-xs sm:text-sm font-semibold">
                  {adminError}
                </div>
              )}

              <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-xs sm:text-sm">
                  <thead>
                    <tr class="bg-gray-100 border-b uppercase text-gray-500">
                      <th class="p-2 sm:p-3">ID</th>
                      <th class="p-2 sm:p-3">Username</th>
                      <th class="p-2 sm:p-3">Email</th>
                      <th class="p-2 sm:p-3 text-center">Action</th>
                    </tr>
                  </thead>
                  <tbody>
                    {adminUsers.map(u => (
                      <tr key={u.id} class="border-b hover:bg-gray-50">
                        <td class="p-2 sm:p-3 text-gray-600">#{u.id}</td>
                        <td class="p-2 sm:p-3 font-semibold text-gray-800">{u.username}</td>
                        <td class="p-2 sm:p-3 text-gray-600 break-all">{u.email || 'No email'}</td>
                        <td class="p-2 sm:p-3 text-center">
                          {u.username.toLowerCase() !== 'admin' ? (
                            <button 
                              onClick={() => {
                                if (window.confirm(`Are you sure you want to delete user "${u.username}"?`)) {
                                  authFetch(`/api/users/${u.id}`, { method: 'DELETE' })
                                    .then(() => fetchAdminUsers());
                                }
                              }} 
                              class="text-red-600 hover:underline text-xs sm:text-sm font-medium"
                            >
                              Delete
                            </button>
                          ) : (
                            <span class="text-xs bg-purple-100 text-purple-800 px-2 py-0.5 rounded font-semibold">Protected</span>
                          )}
                        </td>
                      </tr>
                    ))}
                    {adminUsers.length === 0 && (
                      <tr>
                        <td colSpan="4" class="p-4 sm:p-6 text-center text-gray-500">No other users found.</td>
                      </tr>
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          )}
        </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
